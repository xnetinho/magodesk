name: Flutter Nightly Build

on:
  workflow_dispatch:
    inputs:
      windows-only:
        description: "Build only the Windows portable .exe (uncheck to build every platform)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
      windows-only: ${{ github.event_name != 'workflow_dispatch' || inputs.windows-only }}
      android: false
