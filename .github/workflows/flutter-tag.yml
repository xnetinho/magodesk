name: Flutter Release Build

# Runs when a release is published (draft -> Publish, or created directly).
#   vX.Y.Z      final release
#   vX.Y.Z-rcN  test build: publish it as a pre-release; the build keeps that flag
# The packages are attached to the release itself: <app>-<tag>-<arch>.exe / .msi
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and attach the packages to"
        required: true
        type: string
      windows-only:
        description: "Build only the Windows packages (uncheck to also build Android)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run-flutter-release-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ github.event.release.tag_name || inputs.tag }}
      # a published release builds Windows and Android; a manual run can narrow it to Windows
      windows-only: true
      android: ${{ github.event_name != 'workflow_dispatch' || !inputs.windows-only }}
